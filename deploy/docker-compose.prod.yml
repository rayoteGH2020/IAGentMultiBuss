x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - APP_DOMAIN
      - ACME_EMAIL
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: iagent-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=2
      # Solo Caddy alcanza este puerto (red interna): se confía en su
      # X-Forwarded-Proto para que HTTPSRedirectMiddleware no haga bucle.
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *logging

  worker:
    image: iagent-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["arq", "app.jobs.settings.WorkerSettings"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Clave de salud que ARQ escribe en Redis mientras el worker está vivo.
      test: ["CMD", "arq", "--check", "app.jobs.settings.WorkerSettings"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Deja terminar jobs en curso (extracciones LLM) antes de SIGKILL.
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *logging

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # Rol propietario (migraciones). La app usa saas_app (NOBYPASSRLS).
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - SAAS_APP_DB_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Solo se ejecutan con el volumen vacío (primer arranque).
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./postgres/02-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      # redis-cli lee REDISCLI_AUTH; el mismo valor se usa como requirepass.
      - REDISCLI_AUTH=${REDIS_PASSWORD:?REDIS_PASSWORD missing}
    # noeviction (no allkeys-lru como en dev): Redis guarda la cola ARQ y las
    # claves anti-replay; expulsarlas por memoria perdería jobs o permitiría
    # replays. Si se llena, las escrituras fallan de forma visible.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDISCLI_AUTH" --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
