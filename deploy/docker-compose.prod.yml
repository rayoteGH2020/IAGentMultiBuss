# Producción: una VPS, monolito API + worker ARQ (Arquitectura_V2 §16, D013).
#
# Arranque SIEMPRE a través de Infisical (Agents.md §2; nunca .env ni env_file):
#   bash deploy/scripts/deploy.sh <tag>
# que ejecuta internamente:
#   infisical run --env=prod -- docker compose -f deploy/docker-compose.prod.yml ...
#
# Solo Caddy publica puertos (80/443). Postgres, Redis y la API quedan en la red
# interna de Docker: ojo, los puertos publicados por Docker se saltan ufw.
name: iagent-prod

# Paso de variables sin valor: Compose copia cada una del entorno que inyecta
# Infisical; si no existe allí, no se define en el contenedor y Settings usa su
# default. tests/unit/test_deploy_config.py exige que esta lista cubra Settings.
