{% extends "layouts/auth.html" %}
{% block title %}Iniciar sesión · Mi SaaS{% endblock %}
{% block content %}
<div id="clerk-sign-in"></div>
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="{{ clerk_pub_key }}"
  src="https://{{ clerk_frontend_host }}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  type="text/javascript"
></script>
<script>
  window.addEventListener("load", async () => {
    const C = window.Clerk;
    if (!C) return;
    await C.load();
    const el = document.getElementById("clerk-sign-in");
    if (el) C.mountSignIn(el);
  });
</script>
{% endblock %}
