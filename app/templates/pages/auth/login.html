{% extends "layouts/auth.html" %}
{% block title %}Iniciar sesión · Mi SaaS{% endblock %}
{% block content %}
<div id="clerk-sign-in"></div>
<p id="clerk-sign-in-error" class="mt-4 hidden text-center text-sm text-red-600" role="alert">
  No se pudo cargar el formulario de acceso. Recarga la página o revisa la consola del navegador.
</p>
{% include "components/clerk_browser_script.html" %}
<script src="/static/js/clerk-auth.js"></script>
<script>
  async function waitForClerk(timeoutMs) {
    const started = Date.now();
    while (!window.Clerk) {
      if (Date.now() - started > timeoutMs) return null;
      await new Promise((resolve) => setTimeout(resolve, 50));
    }
    return window.Clerk;
  }

  window.addEventListener("load", async () => {
    const C = await waitForClerk(8000);
    const errorEl = document.getElementById("clerk-sign-in-error");
    if (!C || !window.MiSaaSClerkAuth) {
      if (errorEl) errorEl.classList.remove("hidden");
      return;
    }
    await C.load(window.MiSaaSClerkAuth.loadOptions());
    if (await window.MiSaaSClerkAuth.ensureOrgOrRedirect(C)) return;
    window.MiSaaSClerkAuth.watchNoOrgRedirect(C);
    const el = document.getElementById("clerk-sign-in");
    if (el) {
      C.mountSignIn(el, {
        forceRedirectUrl: "/",
        signUpUrl: "/signup",
      });
    }
  });
</script>
{% endblock %}
