{% extends "layouts/auth.html" %}
{% block title %}Registro · Mi SaaS{% endblock %}
{% block content %}
<div id="clerk-sign-up"></div>
<p id="clerk-sign-up-error" class="mt-4 hidden text-center text-sm text-red-600" role="alert">
  No se pudo cargar el formulario de registro. Recarga la página o revisa la consola del navegador.
</p>
{% include "components/clerk_browser_script.html" %}
<script>
  async function waitForClerk(timeoutMs) {
    const started = Date.now();
    while (!window.Clerk) {
      if (Date.now() - started > timeoutMs) return null;
      await new Promise((resolve) => setTimeout(resolve, 50));
    }
    return window.Clerk;
  }

  window.addEventListener("load", async () => {
    const C = await waitForClerk(8000);
    const errorEl = document.getElementById("clerk-sign-up-error");
    if (!C) {
      if (errorEl) errorEl.classList.remove("hidden");
      return;
    }
    await C.load({
      signInUrl: "/login",
      signUpUrl: "/signup",
      afterSignInUrl: "/",
      afterSignUpUrl: "/",
      afterSignOutUrl: "/login",
    });
    const el = document.getElementById("clerk-sign-up");
    if (el) {
      C.mountSignUp(el, {
        afterSignInUrl: "/",
        afterSignUpUrl: "/",
      });
    }
  });
</script>
{% endblock %}
