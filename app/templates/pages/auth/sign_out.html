<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Cerrando sesión… · Mi SaaS</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 p-6">
  <p class="text-slate-600" id="sign-out-status">Cerrando sesión…</p>
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="{{ clerk_pub_key }}"
    src="https://{{ clerk_frontend_host }}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
  <script>
    window.addEventListener("load", async () => {
      const origin = window.location.origin;
      const doneUrl = `${origin}/logout/done`;

      function finishOnServer() {
        document.getElementById("sign-out-status").textContent = "Redirigiendo…";
        window.location.assign(doneUrl);
      }

      try {
        const C = window.Clerk;
        if (!C) {
          finishOnServer();
          return;
        }
        await C.load({
          signInUrl: "/login",
          signUpUrl: "/signup",
          afterSignInUrl: "/",
          afterSignUpUrl: "/",
          afterSignOutUrl: "/login",
        });
        if (typeof C.signOut !== "function") {
          finishOnServer();
          return;
        }
        await C.signOut({ redirectUrl: doneUrl });
      } catch (_) {
        finishOnServer();
      }
    });
  </script>
</body>
</html>
