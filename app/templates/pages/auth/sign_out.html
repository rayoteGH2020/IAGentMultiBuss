<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="refresh" content="10;url=/logout/done">
  <title>Cerrando sesión… · Mi SaaS</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 p-6">
  <p class="text-slate-600" id="sign-out-status">Cerrando sesión…</p>
  {% include "components/clerk_browser_script.html" %}
  <script>
    (function () {
      const doneUrl = window.location.origin + "/logout/done";
      const statusEl = document.getElementById("sign-out-status");
      let finished = false;

      function finishOnServer() {
        if (finished) return;
        finished = true;
        if (statusEl) statusEl.textContent = "Redirigiendo…";
        window.location.replace(doneUrl);
      }

      setTimeout(finishOnServer, 10000);

      function waitFor(fn, timeoutMs, intervalMs) {
        return new Promise(function (resolve) {
          const start = Date.now();
          const id = setInterval(function () {
            try {
              const v = fn();
              if (v) {
                clearInterval(id);
                resolve(v);
                return;
              }
            } catch (_) {}
            if (Date.now() - start > timeoutMs) {
              clearInterval(id);
              resolve(null);
            }
          }, intervalMs);
        });
      }

      window.addEventListener("load", async function () {
        const ClerkObj = await waitFor(function () {
          return window.Clerk || null;
        }, 12000, 50);

        if (!ClerkObj || typeof ClerkObj.load !== "function") {
          finishOnServer();
          return;
        }

        try {
          await ClerkObj.load({
            signInUrl: "/login",
            signUpUrl: "/signup",
            afterSignInUrl: "/",
            afterSignUpUrl: "/",
            afterSignOutUrl: doneUrl,
          });
          if (typeof ClerkObj.signOut === "function") {
            await ClerkObj.signOut();
          }
        } catch (_) {}

        finishOnServer();
      });
    })();
  </script>
</body>
</html>
