<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Cerrando sesión… · Mi SaaS</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 p-6">
  <p class="text-slate-600" id="sign-out-status">Cerrando sesión…</p>
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="{{ clerk_pub_key }}"
    src="https://{{ clerk_frontend_host }}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
  <script>
    (function () {
      const origin = window.location.origin;
      const doneUrl = origin + "/logout/done";
      const statusEl = document.getElementById("sign-out-status");

      function finishOnServer() {
        if (statusEl) statusEl.textContent = "Redirigiendo…";
        window.location.replace(doneUrl);
      }

      function waitFor(fn, timeoutMs, intervalMs) {
        return new Promise(function (resolve) {
          var start = Date.now();
          var id = setInterval(function () {
            try {
              var v = fn();
              if (v) {
                clearInterval(id);
                resolve(v);
                return;
              }
            } catch (_) {}
            if (Date.now() - start > timeoutMs) {
              clearInterval(id);
              resolve(null);
            }
          }, intervalMs);
        });
      }

      window.addEventListener("load", async function () {
        var ClerkObj = await waitFor(function () {
          return window.Clerk || null;
        }, 12000, 50);

        if (!ClerkObj || typeof ClerkObj.load !== "function") {
          finishOnServer();
          return;
        }

        try {
          await ClerkObj.load({
            signInUrl: "/login",
            signUpUrl: "/signup",
            afterSignInUrl: "/",
            afterSignUpUrl: "/",
            afterSignOutUrl: "/login",
          });
          if (typeof ClerkObj.signOut !== "function") {
            finishOnServer();
            return;
          }
          await ClerkObj.signOut({ redirectUrl: doneUrl });
        } catch (_) {
          finishOnServer();
        }
      });
    })();
  </script>
</body>
</html>
