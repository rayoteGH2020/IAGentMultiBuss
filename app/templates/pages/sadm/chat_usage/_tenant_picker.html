{# Desplegable buscable de tenants (SADM chat usage).
   Espera: tenant_options (list[{id,name,plan}]), selected_tenant_id opcional. #}
<div class="relative max-w-lg"
     x-data='tenantSearchSelect({
       tenants: {{ tenant_options | tojson }},
       selectedId: {{ (selected_tenant_id | string) | tojson if selected_tenant_id else "null" }},
       basePath: "/sadm/chat-usage"
     })'
     @keydown.escape.window="close()"
     @click.outside="close()">
  <label class="mb-1.5 block text-xs font-medium text-slate-500" for="chat-usage-tenant-query">
    Organización
  </label>
  <button type="button"
          @click="toggle()"
          :aria-expanded="open.toString()"
          aria-haspopup="listbox"
          class="flex w-full min-h-11 cursor-pointer items-center justify-between gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-left text-sm text-slate-900 shadow-sm hover:border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary-500/40">
    <span class="truncate"
          :class="selectedLabel ? 'font-medium text-slate-900' : 'text-slate-400'"
          x-text="selectedLabel || 'Buscar y elegir organización…'"></span>
    <svg class="h-4 w-4 shrink-0 text-slate-400 transition-transform"
         :class="open && 'rotate-180'"
         viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd"
            d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
            clip-rule="evenodd"/>
    </svg>
  </button>

  <div x-show="open"
       x-cloak
       x-transition:enter="transition ease-out duration-100"
       x-transition:enter-start="opacity-0 -translate-y-1"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-75"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="absolute z-30 mt-1 w-full overflow-hidden rounded-lg border border-slate-200 bg-white shadow-lg">
    <div class="border-b border-slate-100 p-2">
      <input id="chat-usage-tenant-query"
             type="search"
             x-ref="query"
             x-model="query"
             @input="onQueryInput()"
             @keydown.arrow-down.prevent="move(1)"
             @keydown.arrow-up.prevent="move(-1)"
             @keydown.enter.prevent="selectHighlighted()"
             placeholder="Filtrar por nombre, plan o id…"
             autocomplete="off"
             class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-primary-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-500/30">
    </div>
    <ul role="listbox" class="max-h-64 overflow-y-auto py-1">
      <template x-for="(t, idx) in filtered" :key="t.id">
        <li role="option">
          <button type="button"
                  @click="select(t)"
                  @mouseenter="highlight = idx"
                  :class="idx === highlight
                    ? 'bg-primary-50 text-primary-900'
                    : 'text-slate-800 hover:bg-slate-50'"
                  class="flex w-full cursor-pointer flex-col items-start gap-0.5 px-3 py-2.5 text-left text-sm">
            <span class="font-medium" x-text="t.name"></span>
            <span class="text-[10px] font-mono text-slate-400">
              <span x-text="t.plan" class="capitalize"></span>
              · <span x-text="t.id"></span>
            </span>
          </button>
        </li>
      </template>
      <li x-show="filtered.length === 0"
          class="px-3 py-4 text-center text-sm text-slate-400">
        Sin resultados para «<span x-text="query"></span>»
      </li>
    </ul>
  </div>
</div>
