<div id="tenant-plan-form" class="space-y-6">
  {% if notice %}
  <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">
    {{ notice }}
  </div>
  {% endif %}

  <div class="rounded-xl border border-slate-200 bg-white p-6 space-y-4">
    <h2 class="text-sm font-semibold text-slate-900">Asignar plan</h2>
    <p class="text-xs text-slate-500">Plan actual: <span class="font-mono">{{ tenant.plan_code or tenant.plan }}</span></p>
    <form hx-post="/sadm/plans/tenants/{{ tenant.id }}"
          hx-target="#tenant-plan-form"
          hx-swap="outerHTML"
          class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Plan</label>
        <select name="plan_code" required
                class="block w-full max-w-xs rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm">
          {% for plan in plans %}
          <option value="{{ plan.code }}"
                  {% if (tenant.plan_code or tenant.plan) == plan.code %}selected{% endif %}>
            {{ plan.name }} ({{ plan.code }})
          </option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Motivo (opcional)</label>
        <input type="text" name="reason" maxlength="200"
               class="block w-full max-w-lg rounded-lg border border-slate-300 px-3 py-2 text-sm"/>
      </div>
      <button type="submit" class="btn-primary cursor-pointer">Guardar plan</button>
    </form>
  </div>

  <div class="rounded-xl border border-slate-200 bg-white p-6 space-y-4">
    <h2 class="text-sm font-semibold text-slate-900">Override de entitlements</h2>
    <p class="text-xs text-slate-500">
      JSON en <code>tenants.settings.entitlements_override</code>. Ejemplo:
      <code>{"features":{"knowledge":true},"limits":{"documents_per_day":150}}</code>
    </p>
    <form hx-post="/sadm/plans/tenants/{{ tenant.id }}/override"
          hx-target="#tenant-plan-form"
          hx-swap="outerHTML"
          class="space-y-3">
      <textarea name="override_json" rows="8"
                class="block w-full rounded-lg border border-slate-300 px-3 py-2 font-mono text-xs"
                placeholder='{"features": {}, "limits": {}}'>{{ override_json }}</textarea>
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Motivo (opcional)</label>
        <input type="text" name="reason" maxlength="200"
               class="block w-full max-w-lg rounded-lg border border-slate-300 px-3 py-2 text-sm"/>
      </div>
      <div class="flex flex-wrap gap-3 items-center">
        <button type="submit" class="btn-primary cursor-pointer">Guardar override</button>
        <button type="submit" name="clear" value="1"
                class="rounded-lg border border-slate-300 px-4 py-2 text-sm cursor-pointer hover:bg-slate-50">
          Limpiar override
        </button>
      </div>
    </form>
  </div>
</div>
