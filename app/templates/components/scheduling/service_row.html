<tr id="service-{{ service.id }}">
  <td class="font-medium {% if not service.is_active %}text-red-600{% endif %}">
    {{ service.name }}
    {% if not service.is_active %}
    <span class="ml-2 text-xs rounded bg-red-50 text-red-700 px-2 py-0.5">Inactivo</span>
    {% endif %}
  </td>
  <td class="text-sm text-slate-700">{{ service.duration_minutes }} min</td>
  <td class="text-sm text-slate-600 max-w-xs truncate" title="{{ service.notes or '' }}">
    {{ service.notes or "—" }}
  </td>
  <td class="text-sm">{{ "Activo" if service.is_active else "Inactivo" }}</td>
  <td class="text-right whitespace-nowrap">
    <button type="button"
            hx-get="/settings/services/{{ service.id }}/edit"
            hx-target="#service-modal-panel"
            hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful) window.dispatchEvent(new CustomEvent('open-service-modal'))"
            class="inline-flex items-center justify-center p-2 text-primary-600 hover:text-primary-800 cursor-pointer"
            aria-label="Editar servicio {{ service.name }}"
            title="Editar">
      {% include "components/icons/pencil.html" %}
    </button>
    <button type="button"
            hx-delete="/settings/services/{{ service.id }}"
            hx-target="#service-{{ service.id }}"
            hx-swap="outerHTML"
            hx-confirm="¿Eliminar este servicio? Las citas históricas quedarán sin servicio asociado."
            class="inline-flex items-center justify-center p-2 text-red-600 hover:text-red-800 cursor-pointer"
            aria-label="Eliminar servicio {{ service.name }}"
            title="Eliminar">
      {% include "components/icons/trash.html" %}
    </button>
  </td>
</tr>
