<tr id="professional-{{ professional.id }}">
  <td class="font-medium">
    <span class="inline-block w-3 h-3 rounded-full mr-2" style="background: {{ professional.color | professional_color }}"></span>
    {{ professional.display_name }}
  </td>
  <td>
    {% if professional.is_active %}
      <span class="text-emerald-700 text-xs font-medium">Activo</span>
      {% if not professional.is_bookable %}<span class="text-slate-500 text-xs">· no agendable</span>{% endif %}
    {% else %}
      <span class="text-slate-500 text-xs font-medium">Inactivo</span>
    {% endif %}
  </td>
  <td class="text-sm text-slate-600">{{ professional.specialty_service_ids | length }} / 3</td>
  <td class="text-right">
    <button type="button"
            hx-get="/settings/professionals/{{ professional.id }}/edit"
            hx-target="#professional-modal"
            hx-swap="innerHTML"
            hx-on::after-request="window.dispatchEvent(new CustomEvent('open-professional-modal'))"
            class="text-primary-600 hover:text-primary-800 text-sm cursor-pointer">
      Editar
    </button>
  </td>
</tr>
