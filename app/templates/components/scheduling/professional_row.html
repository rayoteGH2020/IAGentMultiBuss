<tr id="professional-{{ professional.id }}"
    {% if oob_swap %}hx-swap-oob="{{ oob_swap }}"{% endif %}>
  <td class="font-medium break-words align-middle">
    <span class="inline-block w-3 h-3 rounded-full mr-2 align-middle" style="background: {{ professional.color | professional_color }}"></span>
    {{ professional.display_name }}
  </td>
  <td class="text-sm text-slate-600 align-middle">
    {% if professional.specialty_names %}
      <span class="line-clamp-2 break-words" title="{{ professional.specialty_names | join(', ') }}">
        {{ professional.specialty_names | join(", ") }}
      </span>
    {% else %}
      <span class="text-slate-400">—</span>
    {% endif %}
  </td>
  <td class="align-middle">
    <div class="inline-flex items-center gap-2" role="group" aria-label="Estado del profesional">
      {% if professional.is_active %}
      <span class="inline-flex text-emerald-600" title="Activo" aria-label="Activo">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </span>
      {% else %}
      <span class="inline-flex text-slate-400" title="Inactivo" aria-label="Inactivo">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </span>
      {% endif %}

      {% if professional.is_bookable %}
      <span class="inline-flex text-sky-600" title="Agendable" aria-label="Agendable">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </span>
      {% else %}
      <span class="inline-flex text-slate-400" title="No agendable" aria-label="No agendable">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4l16 16"/>
        </svg>
      </span>
      {% endif %}
    </div>
  </td>
  <td class="text-right whitespace-nowrap align-middle">
    <button type="button"
            hx-get="/settings/professionals/{{ professional.id }}/edit"
            hx-target="#professional-modal-panel"
            hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful) window.dispatchEvent(new CustomEvent('open-professional-modal'))"
            class="btn-secondary inline-flex items-center justify-center p-2 cursor-pointer"
            aria-label="Editar profesional {{ professional.display_name }}"
            title="Editar">
      {% include "components/icons/pencil.html" %}
    </button>
  </td>
</tr>
