<div id="no-org-notify-panel">
  {% if notify_error %}
  <p class="mb-3 text-center text-sm text-red-600" role="alert">{{ notify_error }}</p>
  {% endif %}
  {% if not csrf_token %}
  <p class="text-sm text-slate-600 text-center leading-relaxed">
    No se pudo preparar el aviso (sesión incompleta). Cierra sesión e inicia de nuevo.
  </p>
  {% else %}
  <p class="text-sm text-slate-600 text-center leading-relaxed">
    Pulsa
    <button
      type="button"
      id="no-org-notify-btn"
      class="cursor-pointer border-0 bg-transparent p-0 align-baseline font-semibold text-sky-700 underline decoration-sky-700/40 underline-offset-2 hover:text-sky-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-700"
    >aquí</button>
    para notificar al superadmin esta situación. Recibirás un email cuando puedas acceder.
    <span id="no-org-notify-spinner" class="ml-1 hidden inline-block align-middle" aria-hidden="true">
      <svg class="h-4 w-4 animate-spin text-slate-400" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25"/>
        <path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="3" class="opacity-75"/>
      </svg>
    </span>
  </p>
  <script>
    (function () {
      var btn = document.getElementById("no-org-notify-btn");
      if (!btn || btn.dataset.bound === "1") return;
      btn.dataset.bound = "1";
      var csrfToken = {{ csrf_token|tojson }};

      function setBusy(busy) {
        btn.disabled = !!busy;
        if (typeof window.setNoOrgLogoutBusy === "function") {
          window.setNoOrgLogoutBusy(busy);
        }
      }

      btn.addEventListener("click", async function () {
        if (btn.disabled) return;
        setBusy(true);
        var panel = document.getElementById("no-org-notify-panel");
        var spinner = document.getElementById("no-org-notify-spinner");
        var token = (window.getCsrfToken && window.getCsrfToken()) || csrfToken || "";
        if (spinner) spinner.classList.remove("hidden");
        try {
          var resp = await fetch("/onboarding/notify-superadmin", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Accept": "text/html",
              "HX-Request": "true",
              "X-CSRF-Token": token,
            },
          });
          var redirect = resp.headers.get("HX-Redirect");
          if (redirect) {
            window.location.href = redirect;
            return;
          }
          var html = await resp.text();
          if (resp.ok && panel && html) {
            setBusy(false);
            panel.outerHTML = html;
            return;
          }
          setBusy(false);
          if (spinner) spinner.classList.add("hidden");
          if (panel) {
            var existing = panel.querySelector("[data-notify-error]");
            if (existing) existing.remove();
            var err = document.createElement("p");
            err.className = "mb-3 text-center text-sm text-red-600";
            err.setAttribute("role", "alert");
            err.setAttribute("data-notify-error", "1");
            err.textContent = "No se pudo enviar el aviso. Inténtalo de nuevo.";
            panel.prepend(err);
          }
        } catch (_) {
          setBusy(false);
          if (spinner) spinner.classList.add("hidden");
        }
      });
    })();
  </script>
  {% endif %}
</div>
