<div id="tenant-info" class="card">
  <h3 class="font-semibold">Información de la organización</h3>

  <form
    hx-post="/settings/organization/name"
    hx-target="#tenant-info"
    hx-swap="outerHTML"
    hx-indicator="#tenant-name-save-spinner"
    class="mt-4 flex flex-wrap gap-2 items-end">
    <div class="flex-1 min-w-[12rem]">
      <label for="tenant-org-name" class="block text-sm text-slate-600 mb-1">Nombre</label>
      <input type="text" id="tenant-org-name" name="name" value="{{ tenant.name }}"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
             required minlength="2" maxlength="120">
    </div>
    <div class="flex items-center gap-2">
      <span id="tenant-name-save-spinner" class="htmx-indicator text-sm text-slate-500">Guardando…</span>
      <button type="submit" class="btn-primary">Guardar</button>
    </div>
  </form>

  {% if saved %}
    <p class="mt-3 text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-md px-3 py-2" role="status">
      Nombre actualizado correctamente.
    </p>
  {% endif %}
</div>
