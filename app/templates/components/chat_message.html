{# message: ChatMessageRead — solo roles user y assistant en UI #}
{% if message.role == "user" or message.role.value == "user" %}
  <div class="flex justify-end" id="chat-msg-{{ message.id }}">
    <div class="chat-bubble-user">{{ message.content }}</div>
  </div>
{% elif (message.role == "assistant" or message.role.value == "assistant") and message.content %}
  <div class="flex justify-start gap-2.5" id="chat-msg-{{ message.id }}">
    <div
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-sky-100 text-sky-700"
      aria-hidden="true">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
      </svg>
    </div>
    <div class="chat-bubble-assistant whitespace-pre-wrap">{{ message.content }}</div>
  </div>
{% endif %}
