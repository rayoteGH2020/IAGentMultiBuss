name: CI

# Pipeline principal: lint, tipos y tests. Los evals LLM con coste de API
# permanecen en evals.yml (path-filtered + workflow_dispatch).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check app tests

      - name: Ruff format
        run: uv run ruff format --check app tests

      - name: Mypy
        run: uv run mypy app

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas  # pragma: allowlist secret
          POSTGRES_DB: saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas -d saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-not-secret  # pragma: allowlist secret
      # Superusuario para migraciones Alembic (crea rol saas_app en p06).
      DATABASE_URL: postgresql+asyncpg://saas:saas@localhost:5432/saas  # pragma: allowlist secret
      # Conexión RLS usada por fixtures de tests (rol NOBYPASSRLS).
      RLS_TEST_DATABASE_URL: postgresql+asyncpg://saas_app:saas@localhost:5432/saas  # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379/0
      # Clave Fernet válida para tests que arrancan create_app() sin monkeypatch.
      ENCRYPTION_KEY: yL-BW6k7vhMHYSMEpWR5tNDqt6z6K2I0cVIMG0plLuE=  # pragma: allowlist secret
      # Tests con API real (real_llm, RUN_R2_TESTS) quedan excluidos; no inyectar claves LLM aquí.

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Apply DB migrations
        run: uv run alembic upgrade head

      - name: Verify migrations in sync
        run: uv run alembic check

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Integration tests
        run: uv run pytest tests/integration -q -m "integration and not real_llm"
