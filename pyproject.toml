[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "mi-saas"
version = "0.1.0"
description = "SaaS modular para pymes"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",

    # Datos
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pgvector>=0.3.6",

    # Validación y settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # LLM
    "anthropic>=0.40.0",
    "google-genai>=0.3.0",
    "instructor>=1.7.0",
    "voyageai>=0.3.0",

    # Background jobs
    "arq>=0.26.0",
    "python-magic>=0.4.27",

    # Storage
    "boto3>=1.35.0",

    # Observability
    "structlog>=24.4.0",
    "langfuse>=2.55.0",

    # Auth
    "pyjwt[crypto]>=2.10.0",
    "cryptography>=43.0.0",

    # Webhooks
    "svix>=1.42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "playwright>=1.48.0",
    "testcontainers[postgres]>=4.8.0",
    "factory-boy>=3.3.0",
    "respx>=0.21.0",
    "types-boto3>=1.35.0",
    "moto[s3]>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
    "TCH",
    "ASYNC",
    "S",
]
ignore = [
    "E501",
    "S101",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]
"migrations/**" = ["ALL"]
"app/models/invoice.py" = ["TCH003"]
"app/models/llm_call.py" = ["TCH003"]
"app/schemas/invoice.py" = ["TCH003"]
"app/jobs/queue.py" = ["TCH003"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations", "tests/"]

[[tool.mypy.overrides]]
module = ["arq.*", "voyageai.*", "instructor.*", "langfuse.*", "svix.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "app.evals.conftest"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "integration: requiere infra (postgres, redis)",
    "e2e: requiere navegador",
    "slow: tarda más de 1s",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
