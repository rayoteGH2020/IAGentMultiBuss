[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "mi-saas"
version = "0.1.0"
description = "SaaS modular para pymes"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi[standard]>=0.115.0",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    # Datos
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pgvector>=0.3.6",
    # Validación y settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # LLM
    "anthropic>=0.40.0",
    "google-genai>=0.3.0",
    "instructor>=1.7.0",
    "voyageai>=0.3.0",
    # Background jobs
    "arq>=0.26.0",
    "python-magic>=0.4.27",
    # Storage
    "boto3>=1.35.0",
    # Observability
    "structlog>=24.4.0",
    "langfuse>=2.55.0",
    # Auth
    "pyjwt[crypto]>=2.10.0",
    "cryptography>=43.0.0",
    # Email
    "aiosmtplib>=3.0.0",
    # Webhooks
    "svix>=1.42.0",
    "jsonref>=1.1.0",
    "pypdf>=5.1.0",
    "python-magic-bin>=0.4.14",
    "html2text>=2025.4.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "playwright>=1.48.0",
    "testcontainers[postgres]>=4.8.0",
    "factory-boy>=3.3.0",
    "respx>=0.21.0",
    "types-boto3>=1.35.0",
    "moto[s3]>=5.0.0",
    "pytest-timeout>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
    "TCH",
    "ASYNC",
    "S",
]
ignore = [
    "E501",
    "S101",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "TCH"]
"migrations/**" = ["ALL"]
"app/core/document_text.py" = ["S112"]
"app/core/google_calendar_client.py" = ["S105"]
"app/llm/**" = ["TCH"]
"app/jobs/queue.py" = ["TCH003"]
"app/models/invoice.py" = ["TCH003"]
"app/models/doc_type.py" = ["TCH003"]
"app/models/ticket.py" = ["TCH003"]
"app/models/llm_call.py" = ["TCH003"]
"app/models/audit_log.py" = ["TCH003"]
"app/models/chat.py" = ["TCH003"]
"app/models/calendar_integration.py" = ["TCH003"]
"app/models/channel_integration.py" = ["TCH003"]
"app/models/conversation.py" = ["TCH003"]
"app/services/channel_integration_service.py" = ["TCH"]
"app/routes/web/admin_channel_integrations.py" = ["TCH"]
"app/services/channel_chat_service.py" = ["TCH"]
"app/jobs/channel_jobs.py" = ["TCH"]
"app/schemas/channel.py" = ["TCH"]
"app/schemas/invoice.py" = ["TCH003"]
"app/schemas/ticket.py" = ["TCH003"]
"app/schemas/chat.py" = ["TCH"]
"app/schemas/calendar.py" = ["TCH", "S105"]
"app/schemas/document_query.py" = ["TCH"]
"app/schemas/pagination.py" = ["TCH003"]
"app/schemas/document_panel.py" = ["TCH003"]
"app/llm/classification.py" = ["TCH003"]
"app/services/ticket_service.py" = ["TCH003"]
"app/services/chat_service.py" = ["TCH"]
"app/services/chat_tool_runner.py" = ["TCH"]
"app/services/knowledge_search_service.py" = ["S608"]
"app/evals/seed_knowledge_eval.py" = ["S608"]
"app/models/usage_meter.py" = ["TCH003"]
"app/routes/api/webhooks_whatsapp.py" = ["I001"]
"app/routes/api/webhooks_telegram.py" = ["I001"]
"app/services/document_query_service.py" = ["TCH"]
"app/services/audit_service.py" = ["TCH"]
"app/services/document_classification.py" = ["TCH"]
"app/services/document_upload_service.py" = ["TCH"]
"app/services/doc_type_service.py" = ["TCH"]
"app/services/calendar_service.py" = ["TCH"]
"app/routes/web/chat.py" = ["TCH"]
"app/routes/web/integrations.py" = ["TCH"]
"app/routes/web/knowledge.py" = ["TCH", "SIM105"]
"app/deps.py" = ["TCH"]
"app/core/rate_limiter.py" = ["TCH003"]
"app/models/knowledge.py" = ["TCH003", "RUF002"]
"app/schemas/knowledge.py" = ["TCH"]
"app/schemas/knowledge_search.py" = ["TCH"]
"app/services/knowledge_document_service.py" = ["TCH"]
"app/services/knowledge_index_service.py" = ["TCH"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations", "tests/"]

[[tool.mypy.overrides]]
module = ["arq.*", "voyageai.*", "instructor.*", "langfuse.*", "svix.*", "pgvector.*", "html2text.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["misc", "no-untyped-def", "arg-type"]

[[tool.mypy.overrides]]
module = "app.evals.conftest"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
# google-genai 2.x usa _UnionGenericAlias (deprecado en 3.12+, eliminado en 3.17).
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai.types",
]
markers = [
    "integration: requiere infra (postgres, redis)",
    "e2e: requiere navegador",
    "slow: tarda más de 1s",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
